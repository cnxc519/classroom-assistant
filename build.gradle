plugins {
    id 'com.android.application' version '8.8.0'
}
android {
    namespace 'cn.classroom.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.classroom.assistant'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['../asr-upgrade/jniLibs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation files('../asr-upgrade/sherpa-jvm.jar')
}
